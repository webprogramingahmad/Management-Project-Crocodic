# Salinan konfigurasi untuk XAMPP Apache.
# Pasang dengan menyalin ke: C:\xampp\apache\conf\extra\httpd-project-crocodic.conf
# Lalu pastikan httpd.conf memuat baris:
#   Include conf/extra/httpd-project-crocodic.conf

Listen 9000

<VirtualHost *:9000>
    ServerName localhost
    DocumentRoot "C:/xampp/htdocs/project-crocodic/public"

    <Directory "C:/xampp/htdocs/project-crocodic/public">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "logs/project-crocodic-error.log"
    CustomLog "logs/project-crocodic-access.log" common
</VirtualHost>
